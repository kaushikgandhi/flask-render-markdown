site_name: flask-render-markdown
site_description: Flask's render_template for Markdown — serve .md templates to AI agents via content negotiation, HTML to browsers.
site_url: https://flask-render-markdown.readthedocs.io/
repo_url: https://github.com/kaushikgandhi/flask-render-markdown
repo_name: kaushikgandhi/flask-render-markdown

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.footer
    - content.code.copy
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: true
            members_order: source
            show_root_heading: true
            heading_level: 2

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - How detection works: detection.md
  - Configuration: configuration.md
  - Recipes: recipes.md
  - API reference: api.md
  - FAQ: faq.md
  - Changelog: changelog.md
