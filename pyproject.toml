[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flask-render-markdown"
version = "0.1.2"
description = "Flask's render_template for Markdown: serve .md templates to AI agents via content negotiation, and HTML to browsers."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Kaushik Gandhi" }]
requires-python = ">=3.9"
dependencies = ["Flask>=2.0"]
keywords = [
    "flask",
    "markdown",
    "ai-agents",
    "llm",
    "content-negotiation",
    "render_template",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Flask",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Text Processing :: Markup :: Markdown",
]

[project.urls]
Homepage = "https://github.com/kaushikgandhi/flask-render-markdown"
Source = "https://github.com/kaushikgandhi/flask-render-markdown"
Issues = "https://github.com/kaushikgandhi/flask-render-markdown/issues"
Changelog = "https://github.com/kaushikgandhi/flask-render-markdown/blob/main/CHANGELOG.md"

[project.optional-dependencies]
html = ["Markdown>=3.4"]
dev = ["pytest>=7.0", "Markdown>=3.4"]

[tool.hatch.build.targets.wheel]
packages = ["src/flask_render_markdown"]

[tool.pytest.ini_options]
testpaths = ["tests"]
