# Publishes to PyPI via Trusted Publishing (OIDC — no API tokens) whenever a
# GitHub release is published.
#
# One-time setup on PyPI: project page -> Manage -> Publishing -> add a
# "Trusted Publisher" with:
#   owner: kaushikgandhi, repository: flask-render-markdown,
#   workflow: publish.yml, environment: pypi
name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build distributions
        run: |
          python -m pip install build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
