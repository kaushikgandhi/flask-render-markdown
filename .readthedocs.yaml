# Read the Docs configuration for flask-render-markdown
# Reference: https://docs.readthedocs.io/en/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

# Build the site with MkDocs (Material theme; see mkdocs.yml)
mkdocs:
  configuration: mkdocs.yml

# Install the package itself plus the docs toolchain (the "docs" extra
# defined in pyproject.toml) so mkdocstrings can import and introspect
# flask_render_markdown for the API reference pages.
python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
